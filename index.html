<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ポケット家計簿</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="theme-color" content="#ece4d8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: one fixed screen, no page scroll. Top bar (settings / month / log), swipeable month page (aquarium + today's allowance card + two summary tiles), preset row, quick-entry dock. Details (analysis, ledger, entry, settings, log) open as bottom sheets. */
:root{
  --paper:#ece4d8; --sheet:#fffdf9; --card:rgba(255,253,249,.8); --dock:rgba(240,233,222,.8); --ink:#123238; --muted:#4c666a; --line:#e0d5c4;
  --ai:#0f6f80; --ai-soft:#dcecee; --on-ai:#ffffff;
  --out:#b23a0c; --in:#2f6db0; --warn:#a06a10;
  --ease:cubic-bezier(.2,.8,.2,1); --sp:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.45,.64,1);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --font:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#000}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img{-webkit-user-drag:none;pointer-events:none}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
/* 押すと素早く縮み、離すとばねで戻る */
button{font:inherit;color:inherit;cursor:pointer;transition:transform .45s var(--spring)}
button:active:not(:disabled){transform:scale(.95);transition:transform .08s ease-out}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
[hidden]{display:none!important}

/* app shell: シートを開くと奥に下がる */
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;
  transform-origin:50% 0;transition:transform .5s var(--sp),border-radius .5s var(--sp)}
body.sheet-open .app{transform:translateY(calc(env(safe-area-inset-top,0px) + 10px)) scale(.92);border-radius:16px}
.top-bar{flex:none;display:flex;align-items:center;justify-content:space-between;width:100%;max-width:calc(520px + var(--gl) + var(--gr));margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 2px) var(--gr) 0 var(--gl)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;font-size:18px;line-height:1;flex:none}
.hbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--sheet);display:grid;place-items:center;font-size:20px;line-height:1;flex:none}
.hbtn svg{width:20px;height:20px}
.month{display:flex;align-items:center;gap:6px}
.month h1{margin:0;font-size:16px;font-weight:700;min-width:6.5em;text-align:center}

/* month pages */
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
.page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px var(--gr) 8px var(--gl);will-change:transform;backface-visibility:hidden}
.page>*{width:100%;max-width:520px;flex:none}
.tree-head{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.tree-head .k{font-size:13px;color:var(--muted)}
.tree-head .v{font-size:23px;font-weight:700;line-height:1.3}
.chip2{font-size:13px;background:var(--sheet);padding:6px 12px;border-radius:999px;white-space:nowrap}
.tree{flex:1 1 0;min-height:80px;position:relative;margin-top:-12px}
@media (display-mode:standalone){.app{bottom:auto;height:100vh}} /* ホーム画面アプリでは下端の黒い帯が出ないよう画面全体の高さにする */
.tree>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gcard{background:var(--sheet);border-radius:22px;padding:14px 16px;display:grid;gap:7px}
.gcard .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.gcard .l b{font-size:17px}
.gcard .l b.neg{color:var(--out)}
.gbtn{border:0;background:var(--ai-soft);color:var(--ai);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;justify-self:start}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;border:0;background:var(--sheet);border-radius:20px;padding:11px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile b{font-size:19px;font-weight:700;line-height:1.3}
.tile .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .chev{position:absolute;right:13px;top:9px;color:var(--muted);font-style:normal;font-size:17px}
.fstats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;background:var(--paper);border-radius:18px;padding:12px}
.fstats b{display:block;font-size:22px} .fstats span{font-size:11px;color:var(--muted)}
.hrow{display:grid;grid-template-columns:4.5em 1fr auto;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 2px;text-align:left;width:100%;font-size:14px}
.hrow .track{margin:0}
.hrow.cur b{color:var(--ai)}

/* ===== テーマ（保つ家計簿）：背景レイヤー＋主役の絵 ===== */
.bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg>*{position:absolute}
.top-bar,.stage,.presets{position:relative;z-index:1}
.dock{background:var(--dock);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top-color:transparent}
.pace{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5;opacity:.85}
.pace-t{fill:var(--muted);font-size:11px;font-family:var(--font)}
.hbtn,.chip2,.gcard,.tile,.preset:not(.add){background:var(--card)}

/* 古代魚の水槽 */
.aq-wall{inset:0;background:linear-gradient(100deg,#f6f1e8 0%,#ece4d7 55%,#ddd3c4 100%)}
.aq-top{left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 8px);background:linear-gradient(rgba(40,30,20,.32),rgba(40,30,20,0))} /* ステータスバーの白文字を読みやすく */
.aq-win{left:38%;top:-6%;width:80%;height:52%;transform:skewX(-18deg);display:grid;grid-template-columns:1fr 1fr;gap:10px;filter:blur(7px);animation:aqSun 7s ease-in-out infinite}
.aq-win i{background:rgba(255,250,232,.95)}
.aq-leaf{left:42%;top:0;opacity:.16;filter:blur(4px);transform-origin:80% 0;animation:aqLeaf 6s ease-in-out infinite}
.aq-floor{left:0;right:0;bottom:0;height:40%;background:linear-gradient(rgba(180,150,110,0),rgba(150,120,85,.25))}
@keyframes aqSun{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes aqLeaf{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateX(6px)}}
.aq-wave{animation:aqWave 4s linear infinite}
.aq-cau{animation:aqCau 9s ease-in-out infinite alternate}
.aq-swim{transform-box:fill-box;transform-origin:center;animation:aqSwim 16s ease-in-out infinite}
.aq-swim.sad{animation-duration:30s}
.af-tail{transform-box:fill-box;transform-origin:0% 50%;animation:aqTail 1.2s ease-in-out infinite}
.af-fin{transform-box:fill-box;transform-origin:0% 0%;animation:aqFin .9s ease-in-out infinite}
.sad .af-tail{animation-duration:2.4s}
.aq-weed{transform-box:fill-box;transform-origin:bottom;animation:aqWeed 3.4s ease-in-out infinite}
.aq-bub{animation:aqBub 3.6s ease-in infinite}
.aq-rip{opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes aqWave{to{transform:translateX(150px)}}
@keyframes aqCau{to{transform:translate(30px,6px)}}
@keyframes aqSwim{0%{transform:translateX(calc(var(--a,40px)*-1)) scaleX(-1)}45%{transform:translateX(var(--a,40px)) scaleX(-1)}50%{transform:translateX(var(--a,40px)) scaleX(1)}95%{transform:translateX(calc(var(--a,40px)*-1)) scaleX(1)}100%{transform:translateX(calc(var(--a,40px)*-1)) scaleX(-1)}}
@keyframes aqTail{0%,100%{transform:skewY(-9deg)}50%{transform:skewY(9deg) scaleX(.9)}}
@keyframes aqFin{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(16deg)}}
@keyframes aqWeed{0%,100%{transform:skewX(-6deg)}50%{transform:skewX(6deg)}}
@keyframes aqBub{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-140px);opacity:0}}
@keyframes aqRip{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2)}}
.tree.pop .aq-rip{animation:aqRip .9s ease-out}


/* presets + quick entry dock */
.presets{flex:none;display:flex;gap:8px;overflow-x:auto;width:100%;max-width:calc(520px + var(--gl) + var(--gr));margin:0 auto;padding:2px var(--gr) 10px var(--gl);scrollbar-width:none;overscroll-behavior-x:contain}
.presets::-webkit-scrollbar{display:none}
.preset{flex:none;min-width:92px;height:56px;border:0;background:var(--sheet);border-radius:16px;padding:6px 14px;font-size:14px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:0 1px 3px rgba(20,40,70,.06)}
.preset .num{color:var(--muted);font-size:12px;font-weight:400}
.preset.add{color:var(--ai);background:none;border:1.5px dashed var(--line);box-shadow:none}
.dock{flex:none;position:relative;z-index:5;padding:8px var(--gr) calc(env(safe-area-inset-bottom,0px) + 10px) var(--gl);background:var(--paper);border-top:1px solid var(--line)}
.dock.kb{padding-bottom:8px}
.dock-in{max-width:520px;margin:0 auto}
.qbar{display:flex;gap:8px;align-items:stretch}
.qbar textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:16px;line-height:1.4;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;height:46px;max-height:140px;overflow:auto}
.qbar textarea:focus{border-color:var(--ai);outline:none}
.qgo{border:0;background:var(--ai);color:var(--on-ai);border-radius:12px;padding:0 16px;font-weight:700;flex:none}
.qgo:disabled{opacity:.4}
.qcam{width:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--sheet);display:grid;place-items:center;flex:none}
.qcam svg{width:22px;height:22px;stroke:var(--ai)}
.qplus{color:var(--ai);font-size:24px;line-height:1}
.preview{position:absolute;left:0;right:0;bottom:100%;padding:7px calc(var(--gr) + 2px) 7px calc(var(--gl) + 2px);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:pin .3s var(--sp)}
.preview b{color:var(--ink);font-weight:600}
@keyframes pin{from{opacity:0;transform:translateY(6px)}}

/* sheets: analysis / ledger */
.ledger{background:var(--paper);border-radius:16px;padding:16px;display:grid;gap:14px}
.bal-label{font-size:12px;color:var(--muted);letter-spacing:.08em}
.bal{font-size:32px;font-weight:600;line-height:1.1}
.bal.neg{color:var(--out)}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.io div{display:grid;gap:2px}
.io .k{font-size:12px;color:var(--muted)}
.io .v{font-size:18px;font-weight:600}
.io .in{color:var(--in)} .io .out{color:var(--out)}
.meter{display:grid;gap:6px;padding-top:12px;border-top:1px dashed var(--line)}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.link{border:0;background:var(--ai-soft);color:var(--ai);font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:999px}
.track{height:10px;border-radius:5px;background:var(--ai-soft);overflow:hidden}
.track.sm{height:5px;margin-top:6px}
.fill{height:100%;background:var(--ai);border-radius:5px}
.fill.warn{background:var(--warn)} .fill.over{background:var(--out)}
.note{font-size:12px;color:var(--muted)}

section h2{font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}
.cats{display:grid;gap:10px}
.cat{display:grid;grid-template-columns:5em 1fr auto;align-items:center;gap:10px;font-size:14px}
.cat .bar{height:8px;border-radius:4px;background:var(--ai-soft);overflow:hidden}
.cat .bar span{display:block;height:100%;background:var(--ai);opacity:.55;border-radius:4px}
.cat:first-child .bar span{opacity:1}
.cat .amt{font-size:13px;min-width:6.8em;text-align:right}
.cat .pct{color:var(--muted);font-size:11px;margin-left:4px}

.trend{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:120px;border-bottom:1px solid var(--line)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.col .b{width:60%;max-width:28px;background:var(--ai-soft);border-radius:4px 4px 0 0;min-height:2px;transform-origin:bottom}
.col.cur .b{background:var(--ai)}
.col .t{font-size:10px;color:var(--muted);white-space:nowrap}
.trend-x{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;font-size:11px;color:var(--muted);text-align:center;padding-top:4px}
.trend-x .cur{color:var(--ink);font-weight:700}

.day-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:10px 2px 6px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;transition:background-color .3s}
.row:active:not(:disabled){background:var(--ai-soft);transform:none;transition:none}
.chip{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--ai-soft);color:var(--ai);white-space:nowrap}
.chip.inc{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.memo{min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memo small{color:var(--muted)}
.row .a{font-size:15px}
.row .a.in{color:var(--in)}
.empty{background:var(--paper);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* motion: sheet content rises in, bars grow */
.stagger{display:grid;gap:20px}
.stagger>*{animation:rise .55s var(--sp) both}
.stagger>:nth-child(2){animation-delay:.04s} .stagger>:nth-child(3){animation-delay:.08s}
.stagger>:nth-child(4){animation-delay:.12s} .stagger>:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.grow .cat .bar span{animation:gx .8s var(--sp) .15s both;transform-origin:left}
.grow .col .b{animation:gy .8s var(--sp) .2s both}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes gy{from{transform:scaleY(0)}}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .5s var(--sp)}
.scrim.closing{animation:fadeout .38s var(--sp) forwards}
.sheet{background:var(--sheet);width:100%;max-width:560px;border-radius:22px 22px 0 0;
  padding:16px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px));
  display:grid;gap:14px;align-content:start;max-height:calc(100% - env(safe-area-inset-top,0px) - 34px);overflow:auto;overscroll-behavior:contain;animation:up .5s var(--sp);will-change:transform}
.sheet::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--line);justify-self:center;margin:-6px 0 -4px}
.scrim.closing .sheet{animation:down .38s var(--sp) forwards}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fade{from{background:rgba(0,0,0,0)}}
@keyframes fadeout{to{background:rgba(0,0,0,0)}}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h3{margin:0;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sheet);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[aria-pressed="true"].o{color:var(--out)} .seg button[aria-pressed="true"].i{color:var(--in)}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--ai);padding-bottom:4px}
.amount span{font-size:22px;color:var(--muted)}
.amount input{border:0;background:none;color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;font-size:32px;font-weight:600;width:100%;min-width:0;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 13px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ai);color:var(--on-ai);border-color:var(--ai)}
.field{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.field input,.field select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.primary{border:0;background:var(--ai);color:var(--on-ai);border-radius:12px;padding:14px;font-size:16px;font-weight:700}
.primary:disabled{opacity:.5}
.ghost{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 14px;font-size:14px}
.danger{border:1px solid var(--out);background:none;color:var(--out);border-radius:12px;padding:12px;font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1}
.err{color:var(--out);font-size:13px}
.group{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.group h4{margin:0;font-size:13px}
.plist{display:grid;gap:6px}
.pitem{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.pitem button{border:0;background:none;color:var(--out);font-size:13px}
.shot{max-height:180px;border-radius:10px;justify-self:center;object-fit:contain}
.spinner{width:22px;height:22px;border:3px solid var(--ai-soft);border-top-color:var(--ai);border-radius:50%;animation:spin 1s linear infinite;justify-self:center}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 142px);background:var(--ink);color:var(--paper);
  padding:9px 8px 9px 16px;border-radius:999px;font-size:13px;z-index:40;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px);
  box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .55s var(--spring)}
.toast.out{animation:tout .25s ease-in forwards}
.toast button{border:0;background:rgba(127,127,127,.25);color:var(--paper);font-weight:700;padding:4px 12px;border-radius:999px}
@keyframes tin{from{transform:translate(-50%,24px) scale(.9);opacity:0}}
@keyframes tout{to{transform:translate(-50%,10px) scale(.96);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}body.sheet-open .app{transform:none;border-radius:0}}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div class="top-bar">
    <button class="hbtn" id="settingsBtn" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <div class="month">
      <button class="hbtn" id="prev" aria-label="前の月">‹</button>
      <h1 id="mlabel">—</h1>
      <button class="hbtn" id="next" aria-label="次の月">›</button>
    </div>
    <button class="hbtn" id="logBtn" aria-label="水槽日誌">

    </button>

  <div class="stage" id="stage"><div class="page" id="page"></div></div>

    <div class="preview" id="qprev" hidden></div>
    <div class="dock-in">

        <textarea id="q" rows="1" placeholder="例：ランチ 980" enterkeyhint="done" autocomplete="off" aria-label="ひとこと入力"></textarea>
        <button class="qcam" id="cam" aria-label="レシートを撮影">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>

</div>

<script>
/* ================= データ ================= */
const CATS={
  out:["食費","日用品","交通","住居","光熱費","通信","趣味","交際","医療","衣服","その他"],
  in:["給与","賞与","副業","臨時収入","その他"]
};
const KEY="pocket-kakeibo.v1";
const DEFAULT_PRESETS=[
  {name:"コンビニ",amt:500,cat:"食費",type:"out"},
  {name:"ランチ",amt:1000,cat:"食費",type:"out"},
  {name:"電車",amt:220,cat:"交通",type:"out"},
  {name:"カフェ",amt:450,cat:"食費",type:"out"}
];
let data={entries:[],budget:0,presets:DEFAULT_PRESETS.slice(),apiKey:"",model:"claude-haiku-5-5",noSpend:{},budgets:{}};
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||"null");if(o)data=Object.assign(data,o)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast("保存できませんでした。ストレージの空きを確認してください")}}
load();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ================= 便利関数 ================= */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const fmtDate=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>fmtDate(new Date());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return fmtDate(d)};
const ymOf=d=>d.slice(0,7);
const shiftYm=(ym,k)=>{let[y,m]=ym.split("-").map(Number);m+=k;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+pad(m)};
const yen=n=>(n<0?"−":"")+"¥"+Math.abs(Math.round(n)).toLocaleString("ja-JP");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const wd="日月火水木金土";
const dayLabel=d=>{if(d===today())return"今日";if(d===daysAgo(1))return"昨日";const t=new Date(d+"T00:00");return(t.getMonth()+1)+"/"+t.getDate()};

let ym=ymOf(today());
const reduceMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const SP="cubic-bezier(.32,.72,0,1)"; // iOSのシート・ページ送りに近い減速カーブ

/* ================= ひとこと入力の解析 ================= */
const KEYWORDS=[
  ["in","給与",["給料","給与","月給"]],["in","賞与",["ボーナス","賞与"]],["in","副業",["副業","報酬","売上"]],
  ["in","臨時収入",["臨時","お小遣い","こづかい","入金","返金","お祝い"]],
  ["out","日用品",["ドラッグ","薬局","ダイソー","100均","百均","セリア","洗剤","ティッシュ","日用","ニトリ"]],
  ["out","医療",["病院","クリニック","歯医者","歯科","処方","薬","医療","整体"]],
  ["out","食費",["ランチ","昼","夕食","夜ご飯","晩","朝食","朝ご飯","ご飯","ごはん","スーパー","コンビニ","セブン","ファミマ","ローソン","カフェ","コーヒー","スタバ","ドトール","弁当","パン","外食","飲み物","マック","牛丼","ラーメン","寿司","ウーバー","出前","おやつ","食"]],
  ["out","交通",["電車","バス","タクシー","ガソリン","駐車","suica","パスモ","pasmo","定期","高速","新幹線","飛行機","交通"]],
  ["out","住居",["家賃","管理費","住宅","ローン"]],
  ["out","光熱費",["電気","ガス","水道","光熱"]],
  ["out","通信",["スマホ","携帯","ネット","wifi","通信","プロバイダ"]],
  ["out","交際",["飲み会","飲み","プレゼント","ご祝儀","交際","お土産","香典"]],
  ["out","衣服",["服","ユニクロ","gu","靴","美容院","美容室","カット","衣"]],
  ["out","趣味",["本","映画","ゲーム","サブスク","netflix","spotify","amazon","アマゾン","漫画","ジム","趣味","ライブ"]]
];
function learnedMap(){ // 過去の記録：メモ → {cat,type}（新しいもの優先）
  const m={};data.entries.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(e=>{if(e.memo)m[e.memo.toLowerCase()]={cat:e.cat,type:e.type}});return m;
}
function toHalf(s){return s.replace(/[０-９ａ-ｚＡ-Ｚ．，]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/　/g," ")}
function parseLine(raw,learned){
  let s=toHalf(raw).trim().replace(/^[+＋]\s*/,"");if(!s)return null;
  let date=today();
  const dw=[["おととい",2],["一昨日",2],["昨日",1],["きのう",1],["今日",0]];
  for(const[w,n]of dw){if(s.includes(w)){date=daysAgo(n);s=s.replace(w," ");break}}
  const md=s.match(/(\d{1,2})\/(\d{1,2})(?!\d)/);
  if(md&&s.replace(md[0],"").match(/\d/)){ // 「10/21 ランチ 980」のように日付＋金額がある時だけ日付扱い
    const y=new Date().getFullYear();date=y+"-"+pad(+md[1])+"-"+pad(+md[2]);s=s.replace(md[0]," ");
  }
  s=s.replace(/,/g,"");
  let amt=0,hit=null;
  let m=s.match(/(\d+(?:\.\d+)?)\s*万\s*(\d*)\s*円?/);
  if(m){amt=Math.round(parseFloat(m[1])*10000+(m[2]?+m[2]:0));hit=m[0]}
  else if((m=s.match(/(\d+(?:\.\d+)?)\s*(千|k|K)\s*円?/))){amt=Math.round(parseFloat(m[1])*1000);hit=m[0]}
  else{const all=[...s.matchAll(/¥?\s*(\d+)\s*円?/g)];if(all.length){const last=all[all.length-1];amt=+last[1];hit=last[0]}}
  if(!amt)return{error:"金額が見つかりません",raw};
  const memo=s.replace(hit," ").replace(/\s+/g," ").trim();
  let type="out",cat="その他";
  const key=memo.toLowerCase();
  if(learned[key]){({cat,type}=learned[key])}
  else{
    let found=false;
    for(const[t,c,words]of KEYWORDS){if(words.some(w=>key.includes(w.toLowerCase()))){type=t;cat=c;found=true;break}}
    if(!found){ // 部分一致で過去の記録を探す
      const k=Object.keys(learned).find(x=>x&&(key.includes(x)||x.includes(key))&&key.length>=2);
      if(k)({cat,type}=learned[k]);
    }
  }
  if(/^[+＋]/.test(raw.trim())&&type==="out"){type="in";cat="臨時収入"}
  return{type,amt,cat,date,memo};
}
function parseInput(text){
  const learned=learnedMap();
  return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>parseLine(l,learned));
}

/* ================= 記録の追加・取り消し ================= */
function addEntries(list,label){
  const recs=list.map(p=>({id:newId(),type:p.type,amt:p.amt,cat:p.cat,date:p.date,memo:p.memo||"",ts:Date.now()}));
  data.entries.push(...recs);save();
  const last=recs[recs.length-1];ym=ymOf(last.date);render();splash();
  toast(label||(recs.length>1?recs.length+"件を記録しました":(last.type==="in"?"収入 ":"")+(last.memo||last.cat)+" "+yen(last.amt)+" を記録"),"取り消す",()=>{
    const ids=new Set(recs.map(r=>r.id));data.entries=data.entries.filter(e=>!ids.has(e.id));save();render();toast("取り消しました");
  });
}

/* ================= 画面描画 ================= */
function monthEntries(m){return data.entries.filter(e=>ymOf(e.date)===m)}
function totals(m){let i=0,o=0;monthEntries(m).forEach(e=>e.type==="in"?i+=e.amt:o+=e.amt);return{i,o}}

function renderPresets(){
  $("presets").innerHTML=data.presets.map((p,i)=>'<button class="preset" data-i="'+i+'">'+esc(p.name)+'<span class="num">'+yen(p.amt)+'</span></button>').join("")+
    '<button class="preset add" id="addPreset">＋ 定番</button>';
}
const stage=$("stage");
let curPage=$("page");
function render(){
  const cm=ymOf(today());
  if(data.budget&&!(cm in data.budgets)){data.budgets[cm]=data.budget;save()}
  paintPage(curPage,ym);
  renderChrome();
}
function renderChrome(){setLabel(0);renderPresets()}
function setLabel(k){
  const el=$("mlabel"),[y,m]=ym.split("-");el.textContent=y+"年"+Number(m)+"月";
  if(k&&!reduceMotion())el.animate([{opacity:0,transform:"translateX("+(k*16)+"px)"},{opacity:1,transform:"none"}],{duration:420,easing:SP});
}

function budgetFor(m){ // その月の予算。未設定の月は直前に設定した月から引き継ぐ
  if(m in data.budgets)return data.budgets[m];
  const prev=Object.keys(data.budgets).filter(k=>k<m).sort().pop();
  return prev?data.budgets[prev]:m===ymOf(today())?data.budget||0:0;
}
function monthGrowth(m){
  const B=budgetFor(m),now=today();if(!B||m>ymOf(now))return null;
  const[y,mo]=m.split("-").map(Number),dim=new Date(y,mo,0).getDate(),out={},has={};
  monthEntries(m).forEach(e=>{has[e.date]=1;if(e.type==="out")out[e.date]=(out[e.date]||0)+e.amt});
  let spent=0,ok=0,over=0,td=null;
  for(let d=1;d<=dim;d++){
    const date=m+"-"+pad(d);if(date>now)break;
    const target=Math.max(0,(B-spent)/(dim-d+1)),s=out[date]||0,ns=!!data.noSpend[date];
    if(date===now){td={target,spent:s,left:target-s,has:!!has[date],ns};break} // 今日はまだ確定しない
    if(has[date]||ns){if(s<=target)ok++;else over++} // 記録のない日は数えない
    spent+=s;
  }
  return{B,ok,over,today:td,cur:m===ymOf(now)};
}
const rng=s=>()=>(s=s*16807%2147483647)/2147483647;
const r1=n=>Math.round(n*10)/10;
function keepOf(m){
  const B=budgetFor(m),cm=ymOf(today());if(!B||m>cm)return null;
  const r=B-totals(m).o,[y,mo]=m.split("-").map(Number),dim=new Date(y,mo,0).getDate(),cur=m===cm;
  const pace=cur?B*(dim-Number(today().slice(8)))/dim:0;
  return{B,r,p:Math.max(0,Math.min(1,r/B)),pp:pace/B,ahead:r-pace,cur};
}
const man=v=>{const x=v/10000;return(x<10?r1(x):Math.round(x))+"万"};
const MSG={keep:"水位はペースより上。ポリーはのびのび泳いでいます。",over:"今日は水が多く減った日。明日の目安で取り戻せます。",start:"予算を決めると、ポリーの水槽に水が入ります"};
// 残り予算＝水位。点線はペース（月末に0になる配分で今日の終わりに残っているはずの額）
function aquaSVG(k){
    const yW=r1(226-182*k.p),yP=r1(226-182*k.pp),mud=k.p<.35,fy=r1(Math.min(204,Math.max(yW+14,(yW+226)/2)));
    // 魚がガラスからはみ出ないよう、その深さでの水槽の幅に合わせて大きさと泳ぐ幅を決める
    const hw=Math.sqrt(Math.max(0,100*100-(fy-124)*(fy-124)))-10,fs=r1(Math.max(.5,Math.min(1,hw*2/112))*100)/100,amp=Math.max(0,Math.round(hw-56*fs));
    const fin=[];for(let x=30;x<=78;x+=8)fin.push('M'+x+' '+(-7+x/40)+'l3 -5 l2 '+(5-x/80)+'Z');
    return '<svg viewBox="18 6 264 236" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><defs><clipPath id="aqC"><circle cx="150" cy="124" r="100"/></clipPath>'+
      '<linearGradient id="aqW" x2="0" y2="1"><stop offset="0" stop-color="'+(mud?"#a7a77a":"#8fd0d6")+'" stop-opacity=".8"/><stop offset="1" stop-color="'+(mud?"#4f5a3a":"#2c7c88")+'"/></linearGradient>'+
      '<linearGradient id="aqF" x2="0" y2="1"><stop offset="0" stop-color="#55553c"/><stop offset=".5" stop-color="#8d8a62"/><stop offset="1" stop-color="#d8cf9e"/></linearGradient></defs>'+
      '<ellipse cx="150" cy="232" rx="92" ry="7" fill="#5a4630" opacity=".2"/><circle cx="150" cy="124" r="104" fill="rgba(255,255,255,.22)" stroke="rgba(90,120,120,.45)" stroke-width="2"/>'+
      '<g clip-path="url(#aqC)"><rect x="40" y="'+yW+'" width="220" height="'+r1(232-yW)+'" fill="url(#aqW)"/>'+
      '<path class="aq-wave" d="M-150 '+yW+(Array.from({length:12},(_,i)=>'q12.5 -3 25 0t25 0').join(""))+'V'+(yW+5)+'H-150Z" fill="#fff" opacity=".35"/>'+
      (mud?'':'<g class="aq-cau" opacity=".22" stroke="#fff" stroke-width="1.5" fill="none"><path d="M60 '+(yW+30)+'q20 -8 40 0t40 0t40 0"/><path d="M80 '+(yW+60)+'q20 -8 40 0t40 0"/><path d="M50 '+(yW+90)+'q20 -8 40 0t40 0t40 0t40 0"/></g>')+
      '<path d="M50 228Q100 212 150 216T252 228V240H50Z" fill="#c8b58a"/>'+[[96,212],[112,218],[190,214],[208,220],[150,222]].map(([x,y],i)=>'<ellipse cx="'+x+'" cy="'+y+'" rx="'+(5+i%3*2)+'" ry="3.5" fill="'+["#8a7a5a","#a39274","#6f6450"][i%3]+'"/>').join("")+
      '<path class="aq-weed" d="M90 220C84 200 96 186 88 166C98 184 92 200 98 220Z" fill="#4f7a3a"/><path class="aq-weed" style="animation-delay:-1.4s" d="M206 222C200 196 214 182 204 156C218 178 210 198 214 222Z" fill="#3f6a32"/>'+
      '<g transform="translate('+r1(150-52.5*fs)+' '+fy+') scale('+fs+')"><g class="aq-swim'+(mud?" sad":"")+'" style="--a:'+r1(amp/fs)+'px">'+
        '<path class="af-tail" d="M84 -3C92 -8 100 -10 105 -7C101 -2 101 2 105 7C100 10 92 8 84 3Z" fill="#6c6a4a"/>'+
        '<path d="'+fin.join("")+'" fill="#5a583c"/>'+
        '<path d="M0 0C4 -7 14 -9 26 -8C46 -7 66 -6 85 -3L85 3C66 6 46 7 26 8C14 9 4 7 0 0Z" fill="url(#aqF)"/>'+
        '<path d="M22 -1H82" stroke="#3e3c28" stroke-width=".6" opacity=".5"/><path d="M14 -6Q17 0 14 6" stroke="#3e3c28" stroke-width="1" fill="none"/>'+
        '<path class="af-fin" d="M18 5C22 10 28 13 32 12C28 9 24 7 20 4Z" fill="#7a7650"/><circle cx="7" cy="-2" r="1.7" fill="#1a1a10"/><circle cx="6.5" cy="-2.5" r=".5" fill="#fff"/></g></g>'+
      '<g class="aq-bub" fill="none" stroke="#fff" stroke-width="1" opacity=".8"><circle cx="196" cy="214" r="2.5"/><circle cx="200" cy="200" r="1.6"/></g>'+
      '<circle class="aq-rip" cx="150" cy="'+yW+'" r="14" fill="none" stroke="#fff" stroke-width="1.5"/>'+
      (k.cur?'<line class="pace" x1="40" x2="260" y1="'+yP+'" y2="'+yP+'"/>':'')+'</g>'+
      (k.cur?'<text class="pace-t" x="246" y="'+(yP-5)+'" text-anchor="end">ペース</text>':'')+
      '<path d="M78 46A100 100 0 0 1 118 26" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".6"/><ellipse cx="150" cy="22" rx="56" ry="6" fill="none" stroke="rgba(90,120,120,.45)" stroke-width="2"/></svg>';
}
function bgHTML(){
  return '<div class="aq-wall"></div><div class="aq-win" style="grid-template-rows:1fr 1fr"><i></i><i></i><i></i><i></i></div>'+
    '<svg class="aq-leaf" width="220" height="200" viewBox="0 0 220 200"><path d="M170 0C150 40 120 70 60 100M150 30C175 60 190 80 200 110M120 60C100 90 70 120 30 140" stroke="#2d3a20" stroke-width="3" fill="none"/>'+
      [[60,100,-30],[200,110,40],[30,140,-20],[110,70,-50],[180,70,30],[90,120,-10]].map(([x,y,a])=>'<ellipse cx="'+x+'" cy="'+y+'" rx="22" ry="9" transform="rotate('+a+' '+x+' '+y+')" fill="#2d3a20"/>').join("")+'</svg><div class="aq-floor"></div><div class="aq-top"></div>';
}
// 1か月分のページ（水槽・今日の目安・集計タイル）
function pageHTML(m){
  const cm=ymOf(today()),g=monthGrowth(m),k=keepOf(m),M=Number(m.slice(5)),cur=m===cm,X=MSG;
  let h='<div class="tree-head"><div><div class="k">'+(cur?"今月":M+"月")+'の残り</div><div class="v num">'+(k?'<span data-k="rem" data-tw="'+Math.round(k.r)+'">'+yen(k.r)+'</span>':cur?"予算 未設定":m>cm?"これから":"予算のない月")+'</div></div>'+
    (k?'<span class="chip2 num">'+(cur?"ペースより "+(k.ahead>=0?"+":"")+yen(k.ahead):"保てた "+Math.round(k.p*100)+"%")+'</span>':'')+'</div>'+
    '<div class="tree" role="img" aria-label="ポリーの水槽。'+(k?"残り "+yen(k.r)+"、予算 "+yen(k.B):"予算なし")+'">'+
      aquaSVG(k||{B:1,r:1,p:1,pp:0,ahead:0,cur:false})+'</div><div class="gcard">';
  if(cur&&g){
    const d=g.today,left=d.left,pct=d.target>0?Math.min(100,d.spent/d.target*100):(d.spent?100:0);
    h+='<div class="l"><span>今日の目安まで</span>'+(left>=0?'<b class="num">あと <span data-k="left" data-tw="'+Math.round(left)+'">'+yen(left)+'</span></b>':'<b class="num neg"><span data-k="over" data-tw="'+Math.round(-left)+'">'+yen(-left)+'</span> オーバー</b>')+'</div>'+
      '<div class="track"><div class="fill'+(left<0?" over":pct>80?" warn":"")+'" data-k="gfill" data-w="'+pct.toFixed(1)+'" style="width:'+pct.toFixed(1)+'%"></div></div>';
    if(left<0)h+='<div class="note">'+X.over+'</div>';
    else h+='<div class="note">'+(k.ahead>=0?X.keep:"ペースより "+yen(-k.ahead)+" 下。目安内の日を続けると追いつきます。")+'</div>';
    if(!d.has&&!d.ns)h+='<button class="gbtn" data-g="nospend">今日は使わなかった</button>';
    else if(!d.has&&d.ns)h+='<button class="gbtn" data-g="undoNospend">「使わなかった」を取り消す</button>';
  }else if(cur)h+='<div class="l"><span>'+X.start+'</span></div><button class="gbtn" data-g="budget">予算を設定</button>';
  else if(k)h+='<div class="l"><span>'+M+'月の結果</span><b class="num">'+yen(k.r)+' 保てた</b></div><div class="note">予算 '+yen(k.B)+' のうち '+Math.round(k.p*100)+'% を残せました</div>';
  else h+='<div class="note">'+(m>cm?"この月はまだ始まっていません。":"この月は予算が設定されていませんでした。")+'</div>';
  return h+'</div>'+tilesHTML(m);
}
function tilesHTML(m){
  const M=Number(m.slice(5)),cur=m===ymOf(today()),{i,o}=totals(m),B=budgetFor(m),n=monthEntries(m).length,p=B>0?o/B:0;
  return '<div class="tiles">'+
    '<button class="tile" data-tile="stats"><i class="chev">›</i><span class="k">'+(cur?"今月":M+"月")+'の支出</span><b class="num"><span data-k="out" data-tw="'+o+'">'+yen(o)+'</span></b>'+
      (B>0?'<span class="s">予算の '+Math.round(p*100)+'%</span><div class="track sm"><div class="fill'+(p>1?" over":p>.8?" warn":"")+'" data-k="tfill" data-w="'+Math.min(100,p*100).toFixed(1)+'" style="width:'+Math.min(100,p*100).toFixed(1)+'%"></div></div>':'<span class="s">予算 未設定</span>')+'</button>'+

const tw={};
function paintPage(el,m){
  el.innerHTML=pageHTML(m);el.dataset.m=m;

  el.querySelectorAll("[data-k]").forEach(x=>{
    const isW=x.dataset.w!=null,k=m+":"+x.dataset.k,to=+(isW?x.dataset.w:x.dataset.tw),from=tw[k];tw[k]=to;
    if(!live||from==null||from===to)return;
    if(isW)x.animate([{width:from+"%"},{width:to+"%"}],{duration:700,easing:SP});
    else countUp(x,from,to);

}
function countUp(el,from,to){
  const t0=performance.now(),d=650;
  const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=yen(from+(to-from)*e);if(p<1&&el.isConnected)requestAnimationFrame(step)};
  el.textContent=yen(from);requestAnimationFrame(step);
}

/* ================= 月の切り替え（指に追従するページ送り） ================= */
let busy=false;
function makePage(m,x){const el=document.createElement("div");el.className="page";paintPage(el,m);el.style.transform="translateX("+x+"px)";stage.appendChild(el);return el}
function slide(nb,k,from,v){ // 現在のページを押し出し、隣の月を中央へ
  const W=stage.clientWidth,to=-k*W,rem=Math.abs(to-from);
  const d=reduceMotion()?1:Math.round(Math.min(480,Math.max(260,v?rem/Math.abs(v)*2.4:440)));
  busy=true;curPage.style.transform="";
  const opt={duration:d,easing:SP,fill:"forwards"};
  const a=curPage.animate([{transform:"translateX("+from+"px)"},{transform:"translateX("+to+"px)"}],opt);
  nb.animate([{transform:"translateX("+(from+k*W)+"px)"},{transform:"translateX(0)"}],opt);
  ym=nb.dataset.m;setLabel(k);
  whenDone(a,d,()=>{curPage.remove();nb.style.transform="";nb.getAnimations().forEach(x=>x.cancel());nb.id="page";curPage=nb;busy=false;renderChrome()});
}
function whenDone(a,d,f){let done=false;const g=()=>{if(!done){done=true;f()}};a.onfinish=g;setTimeout(g,d+120)} // 完了通知が来ない環境でも必ず片付ける
function snapBack(nb,k,from){
  const W=stage.clientWidth,opt={duration:reduceMotion()?1:420,easing:SP};
  busy=true;curPage.style.transform="";
  const a=curPage.animate([{transform:"translateX("+from+"px)"},{transform:"translateX(0)"}],opt);
  nb.animate([{transform:"translateX("+(from+k*W)+"px)"},{transform:"translateX("+k*W+"px)"}],Object.assign({fill:"forwards"},opt));
  whenDone(a,opt.duration,()=>{nb.remove();busy=false});
}
function goTo(m){
  if(busy||m===ym)return;const k=m>ym?1:-1;
  slide(makePage(m,k*stage.clientWidth),k,0,0);
}
$("prev").onclick=()=>goTo(shiftYm(ym,-1));
$("next").onclick=()=>goTo(shiftYm(ym,1));
let sw=null;
stage.addEventListener("touchstart",e=>{
  if(busy||e.touches.length>1){sw=null;return}
  const t=e.touches[0];sw={x:t.clientX,y:t.clientY,lock:false,dx:0,v:0,lx:t.clientX,lt:e.timeStamp,k:0,nb:null};
},{passive:true});
stage.addEventListener("touchmove",e=>{
  if(!sw)return;const t=e.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;
  if(!sw.lock){if(Math.abs(dx)<6&&Math.abs(dy)<6)return;if(Math.abs(dy)>Math.abs(dx)){sw=null;return}sw.lock=true}
  e.preventDefault();
  const W=stage.clientWidth,k=dx<0?1:-1;
  if(k!==sw.k){sw.nb&&sw.nb.remove();sw.nb=makePage(shiftYm(ym,k),k*W);sw.k=k}
  curPage.style.transform="translateX("+dx+"px)";sw.nb.style.transform="translateX("+(dx+k*W)+"px)";
  const dt=e.timeStamp-sw.lt;if(dt>0){sw.v=.7*((t.clientX-sw.lx)/dt)+.3*sw.v;sw.lx=t.clientX;sw.lt=e.timeStamp}
  sw.dx=dx;
},{passive:false});
const swEnd=e=>{
  if(!sw)return;const s=sw;sw=null;if(!s.lock||!s.nb)return;
  const W=stage.clientWidth,v=e.type==="touchcancel"||e.timeStamp-s.lt>90?0:s.v;
  const go=e.type!=="touchcancel"&&(Math.abs(s.dx)>W*.3||(Math.abs(v)>.3&&Math.sign(v)===Math.sign(s.dx)));
  if(go)slide(s.nb,s.k,s.dx,v);else snapBack(s.nb,s.k,s.dx);
};
stage.addEventListener("touchend",swEnd);stage.addEventListener("touchcancel",swEnd);

  openSheet(head("定番ボタンを追加")+'<div class="note">よく使う支出を登録すると、ボタン1つで今日の記録になります。</div>'+

   '<label class="field">カテゴリ<select id="pCat">'+CATS.out.concat(CATS.in.map(c=>"収入:"+c)).map(c=>{const v=c.startsWith("収入:")?c:c;const sel=(p.type==="in"?"収入:"+p.cat:p.cat)===c;return'<option'+(sel?" selected":"")+'>'+c+'</option>'}).join("")+'</select></label>'+
   '<div class="err" id="err"></div><button class="primary" data-act="savePreset">追加する</button>');
}
function commitPreset(){
  const name=$("pName").value.trim(),amt=parseInt($("pAmt").value.replace(/[^\d]/g,""),10),c=$("pCat").value;
  if(!name||!amt){$("err").textContent="名前と金額を入れてください";return}
  const inc=c.startsWith("収入:");
  data.presets.push({name,amt,cat:inc?c.slice(3):c,type:inc?"in":"out"});save();closeSheet();render();toast("定番に「"+name+"」を追加しました");
}

/* ---- 設定 ---- */
let confirmReset=false;
function openSettings(){
  openSheet(head("設定")+
   '<div class="group" style="border:0;padding-top:0"><h4>定番ボタン</h4><div class="plist">'+
     (data.presets.length?data.presets.map((p,i)=>'<div class="pitem"><span>'+esc(p.name)+'　<span class="num note">'+yen(p.amt)+'・'+esc(p.cat)+'</span></span><button data-act="delPreset" data-i="'+i+'">削除</button></div>').join(""):'<div class="note">まだありません</div>')+
   '</div><button class="ghost" data-act="newPreset">＋ 定番を追加</button></div>'+
   '<div class="group"><h4>レシート読み取り（Claude）</h4>'+
     '<div class="note">Anthropic APIキーを入れると、カメラボタンからレシートを撮影して自動入力できます。キーはこのiPhoneの中だけに保存され、写真はAnthropicにのみ送られます。</div>'+
     '<label class="field">APIキー<input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-…" value="'+esc(data.apiKey||"")+'"></label>'+
     '<label class="field">読み取りモデル<select id="model"><option value="claude-haiku-5-5"'+(data.model==="claude-haiku-5-5"?" selected":"")+'>Haiku（速い・安い）</option><option value="claude-sonnet-5-5"'+(data.model==="claude-sonnet-5-5"?" selected":"")+'>Sonnet（精度重視）</option></select></label>'+
     '<button class="ghost" data-act="saveKey">保存</button></div>'+
   '<div class="group"><h4>バックアップ</h4><div class="note">記録はこのiPhoneの中だけにあります。機種変更やデータ消失に備えて、ときどき書き出してください。</div>'+
     '<div class="btnrow"><button class="ghost" data-act="export">書き出す（JSON）</button><button class="ghost" data-act="import">読み込む</button></div>'+
     '<button class="ghost" data-act="csv">'+ym.replace("-","年")+'月をCSVで書き出す</button></div>'+
   '<div class="group"><h4>リセット</h4>'+(confirmReset?'<div class="btnrow"><button class="danger" data-act="resetYes">すべての記録を消す</button><button class="ghost" data-act="resetNo">やめる</button></div>':'<button class="danger" data-act="reset">すべての記録を消す…</button>')+'</div>'+
   '<div class="note">記録 '+data.entries.length+'件</div>');
}

/* ---- ファイル書き出し（iPhoneでは共有シートから「ファイルに保存」） ---- */
async function shareFile(name,text,type){
  const file=new File([text],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function exportJSON(){shareFile("kakeibo-backup-"+today()+".json",JSON.stringify({app:"pocket-kakeibo",version:1,entries:data.entries,budget:data.budget,presets:data.presets},null,1),"application/json")}
function exportCSV(){
  const rows=[["日付","区分","カテゴリ","金額","メモ"]].concat(monthEntries(ym).sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,e.type==="in"?"収入":"支出",e.cat,e.amt,e.memo||""]));
  shareFile("kakeibo-"+ym+".csv","﻿"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv");
}
$("importFile").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const o=JSON.parse(await f.text());if(!Array.isArray(o.entries))throw 0;
    const have=new Set(data.entries.map(x=>x.id));let n=0;
    o.entries.forEach(x=>{if(x&&x.id&&!have.has(x.id)&&x.amt&&x.date){data.entries.push(x);n++}});
    if(o.presets&&!data.presets.length)data.presets=o.presets;
    if(o.budget&&!data.budget)data.budget=o.budget;
    save();closeSheet();render();toast(n+"件を読み込みました");
  }catch(err){toast("読み込めませんでした。このアプリで書き出したJSONファイルを選んでください")}
});

/* ================= レシート読み取り ================= */
let receiptAbort=null;
$("cam").onclick=()=>{
  if(!data.apiKey){openSettings();toast("先にAPIキーを設定してください");return}
  $("photo").click();
};
$("photo").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  let img;try{img=await shrink(f)}catch(err){toast("画像を開けませんでした");return}
  openSheet(head("レシートを読み取り中")+'<img class="shot" src="'+img.url+'" alt="撮影したレシート"><div class="spinner" role="status" aria-label="読み取り中"></div><div class="note" style="text-align:center">Claudeが金額・日付・お店を読んでいます…</div>');
  try{
    const r=await readReceipt(img.b64);
    draft={type:r.type==="in"?"in":"out",amt:r.total||"",cat:r.category||"その他",date:/^\d{4}-\d{2}-\d{2}$/.test(r.date||"")?r.date:today(),memo:(r.store||"").slice(0,60),_receipt:true};
    if(!CATS[draft.type].includes(draft.cat))draft.cat="その他";
    confirmDel=false;
    drawEntry('<img class="shot" src="'+img.url+'" alt="撮影したレシート"><div class="note">内容を確認して、違うところだけ直してから記録してください。</div>');
  }catch(err){
    if(err.name==="AbortError")return;
    openSheet(head("読み取れませんでした")+'<div class="err">'+esc(err.message||"通信に失敗しました")+'</div><div class="btnrow"><button class="ghost" data-act="retakePhoto">撮り直す</button><button class="ghost" data-act="manual">手で入力</button></div>');
  }
});
function shrink(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const max=1400,s=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      const url=c.toDataURL("image/jpeg",.82);URL.revokeObjectURL(u);res({url,b64:url.split(",")[1]});
    };
    im.onerror=rej;im.src=u;
  });
}
async function readReceipt(b64){
  receiptAbort=new AbortController();
  const prompt="この画像は日本のレシート（または領収書・明細）です。読み取って、次の形のJSONだけを返してください。説明文は不要です。\n"+
    '{"date":"YYYY-MM-DD または null","store":"店名（短く）","total":支払い合計の整数,"category":"カテゴリ","type":"out"}\n'+
    "categoryは次から1つ：「"+CATS.out.join("・")+"」。total は税込の支払い合計（お釣りや預かり金ではない）。今日は"+today()+"です。年が読めない場合は今日に近い日付にしてください。レシートでない画像なら {\"error\":\"理由\"} を返してください。";
  let res;
  try{
    res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:receiptAbort.signal,
      headers:{"content-type":"application/json","x-api-key":data.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:data.model||"claude-haiku-5-5",max_tokens:300,messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:prompt}]}]})});
  }catch(e){if(e.name==="AbortError")throw e;throw new Error("通信できませんでした。電波の届く場所でもう一度試してください。")}
  if(!res.ok){
    const msg=res.status===401?"APIキーが正しくありません。設定から入れ直してください。":res.status===429?"短時間に使いすぎました。少し待ってから試してください。":res.status===400?"リクエストが受け付けられませんでした。モデルの選択を変えて試してください。":"Claudeから応答がありませんでした（"+res.status+"）。";
    throw new Error(msg);
  }
  const j=await res.json();
  const text=(j.content||[]).map(c=>c.text||"").join("");
  const m=text.match(/\{[\s\S]*\}/);if(!m)throw new Error("読み取り結果を解釈できませんでした。明るい場所で撮り直してみてください。");
  const o=JSON.parse(m[0]);if(o.error)throw new Error("レシートとして読めませんでした："+o.error);
  o.total=Math.round(Number(String(o.total).replace(/[^\d.]/g,"")))||0;
  return o;
}

/* ================= シート内の操作 ================= */
sheet.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.id){const en=data.entries.find(x=>x.id===t.dataset.id);if(en){openEntry(en);entryBack=openList}return}
  if(t.dataset.type){readEntry();draft.type=t.dataset.type;redrawEntry();return}
  if(t.dataset.cat){readEntry();draft.cat=t.dataset.cat;redrawEntry();return}
  const a=t.dataset.act;
  switch(a){
    case"close":closeSheet();break;
    case"saveEntry":commitEntry();break;
    case"del":readEntry();confirmDel=true;drawEntry();break;
    case"delNo":readEntry();confirmDel=false;drawEntry();break;
    case"delYes":{const id=draft._orig.id;data.entries=data.entries.filter(x=>x.id!==id);save();render();toast("削除しました");backOrClose();break}
    case"toPreset":readEntry();openPresetForm({name:draft.memo||draft.cat,amt:parseInt(draft.amt,10)||"",cat:draft.cat,type:draft.type});break;
    case"budget":openBudget();break;
    case"saveBudget":data.budget=parseInt(($("bud").value||"0").replace(/[^\d]/g,""),10)||0;data.budgets[ymOf(today())]=data.budget;save();closeSheet();render();toast("予算を保存しました");break;
    case"monthGo":closeSheet();goTo(t.dataset.m);break;
    case"savePreset":commitPreset();break;
    case"newPreset":openPresetForm();break;
    case"delPreset":data.presets.splice(+t.dataset.i,1);save();render();openSettings();break;
    case"saveKey":data.apiKey=$("apiKey").value.trim();data.model=$("model").value;save();toast(data.apiKey?"保存しました。カメラボタンから使えます":"APIキーを消しました");break;
    case"export":exportJSON();break;
    case"import":$("importFile").click();break;
    case"csv":exportCSV();break;
    case"reset":confirmReset=true;openSettings();break;
    case"resetNo":confirmReset=false;openSettings();break;
    case"resetYes":data.entries=[];save();confirmReset=false;closeSheet();render();toast("すべての記録を消しました");break;
    case"retakePhoto":closeSheet();$("photo").click();break;
    case"manual":openEntry(null);break;
  }
});
function redrawEntry(){const shot=sheet.querySelector(".shot");const note=shot?shot.nextElementSibling:null;drawEntry(shot?shot.outerHTML+(note?note.outerHTML:""):"")}
sheet.addEventListener("input",e=>{if(["amt","bud","pAmt"].includes(e.target.id)){const v=e.target.value.replace(/[^\d]/g,"");if(v!==e.target.value)e.target.value=v}});
sheet.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"&&!e.isComposing){e.preventDefault();const b=sheet.querySelector(".primary");b&&b.click()}});

/* ================= その他 ================= */
$("fab").onclick=()=>openEntry(null);
$("settingsBtn").onclick=()=>{confirmReset=false;openSettings()};
$("logBtn").onclick=openLog;
$("bg").innerHTML=bgHTML();

let tt;
function toast(msg,actLabel,act){
  const el=$("toast");$("toastMsg").textContent=msg;const b=$("toastAct");
  if(actLabel){b.hidden=false;b.textContent=actLabel;b.onclick=()=>{hideToast();act()}}else b.hidden=true;
  if(!el.hidden&&!el.classList.contains("out"))el.animate([{transform:"translateX(-50%) scale(1.04)"},{transform:"translateX(-50%)"}],{duration:300,easing:"cubic-bezier(.34,1.45,.64,1)"});
  el.classList.remove("out");el.hidden=false;clearTimeout(tt);tt=setTimeout(hideToast,actLabel?4500:2400);
}
function hideToast(){
  const el=$("toast");if(el.hidden)return;clearTimeout(tt);el.classList.add("out");
  tt=setTimeout(()=>{el.hidden=true;el.classList.remove("out")},reduceMotion()?0:250);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!busy){render()}});
render();
</script>
