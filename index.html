<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ポケット家計簿</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="theme-color" content="#eef2e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121711" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: garden header (this month's tree + today's allowance card) above preset tiles, balance ledger + budget meter, category bars, 6-month trend, dated ledger rows; fixed bottom dock for quick entry; bottom sheets for detail/receipt/settings/forest */
:root{
  --paper:#eef2e6; --sheet:#ffffff; --ink:#1f2a1c; --muted:#5a6655; --line:#dde4d3;
  --ai:#2f5a2a; --ai-soft:#e3ecd9; --on-ai:#ffffff;
  --out:#b3462f; --in:#2f6db0; --warn:#b07a10;
  --leaf1:#5f9a54; --leaf2:#79b06a; --leaf3:#4e8a46; --trunk:#6b4f35; --pot:#c9774b; --pot2:#b3653d; --ground:#dfe6d3;
  --autumn1:#e39a3b; --autumn2:#d4643a; --fruit:#e0533d; --bloom:#f4a9b8; --gold:#f2c14e;
  --ease:cubic-bezier(.2,.8,.2,1);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --font:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#121711; --sheet:#1b221a; --ink:#e7eee2; --muted:#9aa894; --line:#2c3629;
  --ai:#9fd18f; --ai-soft:#24321f; --on-ai:#10200c; --out:#e3846d; --in:#86b6ea; --warn:#e5b247;
  --ground:#263022; color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img{-webkit-user-drag:none;pointer-events:none}
.wrap{max-width:520px;margin:0 auto;display:grid;gap:18px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .14s var(--ease)}
button:active:not(:disabled){transform:scale(.95)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
[hidden]{display:none!important}

/* garden header */
.top{padding:calc(env(safe-area-inset-top,0px) + 8px) var(--gr) 0 var(--gl)}
.top-in{max-width:520px;margin:0 auto;display:grid;gap:4px}
.top-bar{display:flex;align-items:center;justify-content:space-between}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;font-size:18px;line-height:1;flex:none}
.hbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--sheet);display:grid;place-items:center;font-size:20px;line-height:1;flex:none}
.hbtn svg{width:20px;height:20px}
.month{display:flex;align-items:center;gap:6px}
.month h1{margin:0;font-size:16px;font-weight:700;min-width:6.5em;text-align:center}
.tree-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:14px}
.tree-head .k{font-size:13px;color:var(--muted)}
.tree-head .v{font-size:24px;font-weight:700;line-height:1.3}
.chip2{font-size:13px;background:var(--sheet);padding:6px 12px;border-radius:999px;white-space:nowrap}
.tree{height:290px;display:flex;align-items:flex-end;justify-content:center}
.tree svg{width:240px;height:290px;overflow:visible}
.sway{transform-origin:100px 205px;animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.4deg)}}
.tree.pop .sway{animation:pop .7s var(--ease),sway 6s ease-in-out .7s infinite}
@keyframes pop{0%{transform:scale(.95)}45%{transform:scale(1.05)}100%{transform:none}}
.gcard{background:var(--sheet);border-radius:22px;padding:16px 18px;display:grid;gap:8px}
.gcard .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.gcard .l b{font-size:17px}
.gcard .l b.neg{color:var(--out)}
.gbtn{border:0;background:var(--ai-soft);color:var(--ai);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;justify-self:start}
.panel{padding:18px var(--gr) 0 var(--gl)}
.forest{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ftree{border:0;background:var(--paper);border-radius:20px;padding:10px;display:grid;justify-items:center;gap:0}
.ftree svg{width:110px;height:130px}
.ftree b{font-size:14px} .ftree span{font-size:12px;color:var(--muted)}
.ftree.cur{box-shadow:inset 0 0 0 2px var(--ai)}
.fstats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;background:var(--paper);border-radius:18px;padding:12px}
.fstats b{display:block;font-size:22px} .fstats span{font-size:11px;color:var(--muted)}

/* quick entry dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px var(--gr) calc(env(safe-area-inset-bottom,0px) + 10px) var(--gl);
  background:color-mix(in srgb,var(--paper) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.dock.kb{padding-bottom:8px}
.dock-in{max-width:520px;margin:0 auto;display:grid;gap:6px}
.qbar{display:flex;gap:8px;align-items:stretch}
.qbar textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:16px;line-height:1.4;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;height:46px;max-height:140px;overflow:auto}
.qbar textarea:focus{border-color:var(--ai);outline:none}
.qgo{border:0;background:var(--ai);color:var(--on-ai);border-radius:12px;padding:0 16px;font-weight:700;flex:none}
.qgo:disabled{opacity:.4}
.qcam{width:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--sheet);display:grid;place-items:center;flex:none}
.qcam svg{width:22px;height:22px;stroke:var(--ai)}
.qplus{color:var(--ai);font-size:24px;line-height:1}
.preview{font-size:12.5px;color:var(--muted);min-height:1.3em;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 2px}
.preview b{color:var(--ink);font-weight:600}
.presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-right:calc(-1 * var(--gr))}
.presets::-webkit-scrollbar{display:none}
.preset{flex:none;min-width:96px;height:64px;border:0;background:var(--sheet);border-radius:16px;padding:8px 14px;font-size:14px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 1px 3px rgba(20,40,70,.06)}
.preset .num{color:var(--muted);font-size:12px;font-weight:400}
.preset.add{color:var(--ai);background:none;border:1.5px dashed var(--line);box-shadow:none}

.ledger{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.bal-label{font-size:12px;color:var(--muted);letter-spacing:.08em}
.bal{font-size:32px;font-weight:600;line-height:1.1}
.bal.neg{color:var(--out)}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.io div{display:grid;gap:2px}
.io .k{font-size:12px;color:var(--muted)}
.io .v{font-size:18px;font-weight:600}
.io .in{color:var(--in)} .io .out{color:var(--out)}
.meter{display:grid;gap:6px;padding-top:12px;border-top:1px dashed var(--line)}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.link{border:0;background:var(--ai-soft);color:var(--ai);font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:999px}
.track{height:10px;border-radius:5px;background:var(--ai-soft);overflow:hidden}
.fill{height:100%;background:var(--ai);border-radius:5px;transition:width .4s}
.fill.warn{background:var(--warn)} .fill.over{background:var(--out)}
.note{font-size:12px;color:var(--muted)}

section h2{font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}
.cats{display:grid;gap:10px}
.cat{display:grid;grid-template-columns:5em 1fr auto;align-items:center;gap:10px;font-size:14px}
.cat .bar{height:8px;border-radius:4px;background:var(--ai-soft);overflow:hidden}
.cat .bar span{display:block;height:100%;background:var(--ai);opacity:.55;border-radius:4px}
.cat:first-child .bar span{opacity:1}
.cat .amt{font-size:13px;min-width:6.8em;text-align:right}
.cat .pct{color:var(--muted);font-size:11px;margin-left:4px}

.trend{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:120px;border-bottom:1px solid var(--line)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.col .b{width:60%;max-width:28px;background:var(--ai-soft);border-radius:4px 4px 0 0;min-height:2px}
.col.cur .b{background:var(--ai)}
.col .t{font-size:10px;color:var(--muted);white-space:nowrap}
.trend-x{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;font-size:11px;color:var(--muted);text-align:center;padding-top:4px}
.trend-x .cur{color:var(--ink);font-weight:700}

.day-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:10px 2px 6px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row:active{background:var(--ai-soft);transform:none}
.row.new{animation:flash 1.6s ease-out}
@keyframes flash{0%,35%{background:var(--ai-soft)}100%{background:transparent}}
.chip{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--ai-soft);color:var(--ai);white-space:nowrap}
.chip.inc{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.memo{min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memo small{color:var(--muted)}
.row .a{font-size:15px}
.row .a.in{color:var(--in)}
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* motion: sheets, toast, bar growth */
.grow .cat .bar span{animation:gx .6s var(--ease) both;transform-origin:left}
.grow .col .b{animation:gy .6s var(--ease) both}
.col .b{transform-origin:bottom}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes gy{from{transform:scaleY(0)}}

.scrim{position:fixed;inset:0;background:rgba(10,20,25,.42);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .3s ease-out}
.scrim.closing{animation:fadeout .22s ease-in forwards}
.sheet{background:var(--sheet);width:100%;max-width:560px;border-radius:22px 22px 0 0;
  padding:16px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px));
  display:grid;gap:14px;max-height:92vh;overflow:auto;overscroll-behavior:contain;animation:up .38s var(--ease)}
.sheet::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--line);justify-self:center;margin:-6px 0 -4px}
.scrim.closing .sheet{animation:down .22s ease-in forwards}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fade{from{background:rgba(10,20,25,0)}}
@keyframes fadeout{to{background:rgba(10,20,25,0)}}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h3{margin:0;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sheet);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[aria-pressed="true"].o{color:var(--out)} .seg button[aria-pressed="true"].i{color:var(--in)}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--ai);padding-bottom:4px}
.amount span{font-size:22px;color:var(--muted)}
.amount input{border:0;background:none;color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;font-size:32px;font-weight:600;width:100%;min-width:0;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 13px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ai);color:var(--on-ai);border-color:var(--ai)}
.field{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.field input,.field select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.primary{border:0;background:var(--ai);color:var(--on-ai);border-radius:12px;padding:14px;font-size:16px;font-weight:700}
.primary:disabled{opacity:.5}
.ghost{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 14px;font-size:14px}
.danger{border:1px solid var(--out);background:none;color:var(--out);border-radius:12px;padding:12px;font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1}
.err{color:var(--out);font-size:13px}
.group{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.group h4{margin:0;font-size:13px}
.plist{display:grid;gap:6px}
.pitem{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.pitem button{border:0;background:none;color:var(--out);font-size:13px}
.shot{max-height:180px;border-radius:10px;justify-self:center;object-fit:contain}
.spinner{width:22px;height:22px;border:3px solid var(--ai-soft);border-top-color:var(--ai);border-radius:50%;animation:spin 1s linear infinite;justify-self:center}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);background:var(--ink);color:var(--paper);
  padding:9px 8px 9px 16px;border-radius:999px;font-size:13px;z-index:40;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px);
  box-shadow:0 6px 20px rgba(0,0,0,.18);animation:tin .34s var(--ease)}
.toast.out{animation:tout .2s ease-in forwards}
.toast button{border:0;background:rgba(127,127,127,.25);color:var(--paper);font-weight:700;padding:4px 12px;border-radius:999px}
@keyframes tin{from{transform:translate(-50%,18px);opacity:0}}
@keyframes tout{to{transform:translate(-50%,10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="top-bar">
      <button class="hbtn" id="settingsBtn" aria-label="設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
      <div class="month">
        <button class="hbtn" id="prev" aria-label="前の月">‹</button>
        <h1 id="mlabel">—</h1>
        <button class="hbtn" id="next" aria-label="次の月">›</button>
      </div>
      <button class="hbtn" id="forestBtn" aria-label="わたしの森">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l5 7h-3l4 6H6l4-6H7z"/><line x1="12" y1="16" x2="12" y2="21"/></svg>
      </button>
    </div>
    <div class="tree-head">
      <div><div class="k" id="treeK">今月の木</div><div class="v" id="treeV">種</div></div>
      <span class="chip2" id="treeChip" hidden></span>
    </div>
    <div class="tree" id="tree" role="img"></div>
    <div class="gcard" id="goal"></div>
  </div>
</div>

<div class="panel">
<main class="wrap" id="main">
  <div class="presets" id="presets"></div>

  <div class="ledger">
    <div>
      <div class="bal-label">今月の収支</div>
      <div class="bal num" id="bal">¥0</div>
    </div>
    <div class="io">
      <div><span class="k">収入</span><span class="v num in" id="sumIn">¥0</span></div>
      <div><span class="k">支出</span><span class="v num out" id="sumOut">¥0</span></div>
    </div>
    <div class="meter">
      <div class="meter-top"><span id="budgetLabel">予算 未設定</span><button class="link" id="editBudget">予算を設定</button></div>
      <div class="track"><div class="fill" id="fill" style="width:0"></div></div>
      <div class="note" id="meterNote"></div>
    </div>
  </div>

  <section>
    <h2>カテゴリ別の支出</h2>
    <div class="cats" id="cats"></div>
  </section>

  <section>
    <h2>支出の推移（6か月）</h2>
    <div class="trend" id="trend"></div>
    <div class="trend-x" id="trendX"></div>
  </section>

  <section>
    <h2>明細</h2>
    <div id="list"></div>
  </section>
</main>
</div>

<div class="dock" id="dock">
  <div class="dock-in">
    <div class="preview" id="qprev" hidden></div>
    <div class="qbar">
      <button class="qcam qplus" id="fab" aria-label="詳しく記録する">＋</button>
      <textarea id="q" rows="1" placeholder="例：ランチ 980" enterkeyhint="done" autocomplete="off" aria-label="ひとこと入力"></textarea>
      <button class="qcam" id="cam" aria-label="レシートを撮影">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <button class="qgo" id="qgo" disabled>記録</button>
    </div>
  </div>
</div>
<input type="file" id="photo" accept="image/*" hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script>
/* ================= データ ================= */
const CATS={
  out:["食費","日用品","交通","住居","光熱費","通信","趣味","交際","医療","衣服","その他"],
  in:["給与","賞与","副業","臨時収入","その他"]
};
const KEY="pocket-kakeibo.v1";
const DEFAULT_PRESETS=[
  {name:"コンビニ",amt:500,cat:"食費",type:"out"},
  {name:"ランチ",amt:1000,cat:"食費",type:"out"},
  {name:"電車",amt:220,cat:"交通",type:"out"},
  {name:"カフェ",amt:450,cat:"食費",type:"out"}
];
let data={entries:[],budget:0,presets:DEFAULT_PRESETS.slice(),apiKey:"",model:"claude-haiku-5-5",noSpend:{},budgets:{},treeSeen:{}};
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||"null");if(o)data=Object.assign(data,o)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast("保存できませんでした。ストレージの空きを確認してください")}}
load();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ================= 便利関数 ================= */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const fmtDate=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>fmtDate(new Date());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return fmtDate(d)};
const ymOf=d=>d.slice(0,7);
const shiftYm=(ym,k)=>{let[y,m]=ym.split("-").map(Number);m+=k;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+pad(m)};
const yen=n=>(n<0?"−":"")+"¥"+Math.abs(Math.round(n)).toLocaleString("ja-JP");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function learnedMap(){ // 過去の記録：メモ → {cat,type}（新しいもの優先）
  const m={};data.entries.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(e=>{if(e.memo)m[e.memo.toLowerCase()]={cat:e.cat,type:e.type}});return m;
}
function toHalf(s){return s.replace(/[０-９ａ-ｚＡ-Ｚ．，]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/　/g," ")}
function parseLine(raw,learned){
  let s=toHalf(raw).trim().replace(/^[+＋]\s*/,"");if(!s)return null;
  let date=today();
  const dw=[["おととい",2],["一昨日",2],["昨日",1],["きのう",1],["今日",0]];
  for(const[w,n]of dw){if(s.includes(w)){date=daysAgo(n);s=s.replace(w," ");break}}
  const md=s.match(/(\d{1,2})\/(\d{1,2})(?!\d)/);
  if(md&&s.replace(md[0],"").match(/\d/)){ // 「10/21 ランチ 980」のように日付＋金額がある時だけ日付扱い
    const y=new Date().getFullYear();date=y+"-"+pad(+md[1])+"-"+pad(+md[2]);s=s.replace(md[0]," ");
  }
  s=s.replace(/,/g,"");
  let amt=0,hit=null;
  let m=s.match(/(\d+(?:\.\d+)?)\s*万\s*(\d*)\s*円?/);
  if(m){amt=Math.round(parseFloat(m[1])*10000+(m[2]?+m[2]:0));hit=m[0]}
  else if((m=s.match(/(\d+(?:\.\d+)?)\s*(千|k|K)\s*円?/))){amt=Math.round(parseFloat(m[1])*1000);hit=m[0]}
  else{const all=[...s.matchAll(/¥?\s*(\d+)\s*円?/g)];if(all.length){const last=all[all.length-1];amt=+last[1];hit=last[0]}}
  if(!amt)return{error:"金額が見つかりません",raw};
  const memo=s.replace(hit," ").replace(/\s+/g," ").trim();
  let type="out",cat="その他";
  const key=memo.toLowerCase();
  if(learned[key]){({cat,type}=learned[key])}
  else{
    let found=false;
    for(const[t,c,words]of KEYWORDS){if(words.some(w=>key.includes(w.toLowerCase()))){type=t;cat=c;found=true;break}}
    if(!found){ // 部分一致で過去の記録を探す
      const k=Object.keys(learned).find(x=>x&&(key.includes(x)||x.includes(key))&&key.length>=2);
      if(k)({cat,type}=learned[k]);
    }
  }
  if(/^[+＋]/.test(raw.trim())&&type==="out"){type="in";cat="臨時収入"}
  return{type,amt,cat,date,memo};
}
function parseInput(text){
  const learned=learnedMap();
  return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>parseLine(l,learned));
}

/* ================= 記録の追加・取り消し ================= */
function addEntries(list,label){
  const recs=list.map(p=>({id:newId(),type:p.type,amt:p.amt,cat:p.cat,date:p.date,memo:p.memo||"",ts:Date.now()}));
  data.entries.push(...recs);save();
  const last=recs[recs.length-1];ym=ymOf(last.date);flashIds=new Set(recs.map(r=>r.id));render();popTree();
  toast(label||(recs.length>1?recs.length+"件を記録しました":(last.type==="in"?"収入 ":"")+(last.memo||last.cat)+" "+yen(last.amt)+" を記録"),"取り消す",()=>{
    const ids=new Set(recs.map(r=>r.id));data.entries=data.entries.filter(e=>!ids.has(e.id));save();render();toast("取り消しました");
  });
}

/* ================= 育つ木 ================= */
// 毎月1日に種から始まり、予算内で終えた日の数で育つ。超過した日の分だけ葉が紅葉する
const STAGES=[[0,"種"],[1,"芽"],[3,"双葉"],[6,"苗"],[10,"若木"],[15,"木"],[20,"花が咲く"],[25,"実る"]];
const stageOf=ok=>{let s=0;STAGES.forEach(([n],i)=>{if(ok>=n)s=i});return s};
function budgetFor(m){ // その月の予算。未設定の月は直前に設定した月から引き継ぐ（設定前の月には木がない）
  if(m in data.budgets)return data.budgets[m];
  const prev=Object.keys(data.budgets).filter(k=>k<m).sort().pop();
  return prev?data.budgets[prev]:m===ymOf(today())?data.budget||0:0;
}
function monthGrowth(m){
  const B=budgetFor(m),now=today();if(!B||m>ymOf(now))return null;
  const[y,mo]=m.split("-").map(Number),dim=new Date(y,mo,0).getDate(),out={},has={};
  monthEntries(m).forEach(e=>{has[e.date]=1;if(e.type==="out")out[e.date]=(out[e.date]||0)+e.amt});
  let spent=0,ok=0,over=0,td=null;
  for(let d=1;d<=dim;d++){
    const date=m+"-"+pad(d);if(date>now)break;
    const target=Math.max(0,(B-spent)/(dim-d+1)),s=out[date]||0,ns=!!data.noSpend[date];
    if(date===now){td={target,spent:s,left:target-s,has:!!has[date],ns};break} // 今日はまだ確定しない
    if(has[date]||ns){if(s<=target)ok++;else over++} // 記録のない日は数えない
    spent+=s;
  }
  return{B,ok,over,today:td,cur:m===ymOf(now)};
}
function treeSVG(stage,over,ok){
  const leaves=[],L=s=>leaves.push(s),T=w=>' style="stroke:var(--trunk)" stroke-width="'+w+'" fill="none" stroke-linecap="round"';
  let body="";
  if(stage===0)body='<ellipse cx="100" cy="203" rx="9" ry="6" style="fill:var(--trunk)"/>';
  else if(stage===1){body='<path d="M100 204C100 196 101 190 102 184" style="stroke:var(--leaf1)" stroke-width="4" fill="none" stroke-linecap="round"/>';L('<ellipse cx="108" cy="184" rx="8" ry="4" transform="rotate(-25 108 184)"/>')}
  else if(stage===2){body='<path d="M100 204V168" style="stroke:var(--leaf1)" stroke-width="5" stroke-linecap="round"/>';L('<ellipse cx="86" cy="164" rx="15" ry="8" transform="rotate(20 86 164)"/>');L('<ellipse cx="114" cy="164" rx="15" ry="8" transform="rotate(-20 114 164)"/>')}
  else if(stage===3){body='<path d="M100 204C98 180 103 160 100 128" style="stroke:var(--leaf1)" stroke-width="5" fill="none" stroke-linecap="round"/>';
    L('<ellipse cx="84" cy="170" rx="16" ry="8" transform="rotate(25 84 170)"/>');L('<ellipse cx="117" cy="156" rx="16" ry="8" transform="rotate(-25 117 156)"/>');
    L('<ellipse cx="86" cy="140" rx="14" ry="7" transform="rotate(20 86 140)"/>');L('<ellipse cx="112" cy="126" rx="13" ry="7" transform="rotate(-30 112 126)"/>')}
  else if(stage===4){body='<path d="M100 204C98 170 103 140 100 110"'+T(7)+'/>';L('<circle cx="100" cy="96" r="40"/>');L('<circle cx="76" cy="112" r="22"/>')}
  else{
    const k=stage-5,r=[[48,30],[52,32],[56,34]][k];
    body='<path d="M100 204C98 160 104 130 100 90"'+T(stage===7?10:9)+'/><path d="M101 150C115 140 128 134 140 120"'+T(5)+'/>';
    L('<circle cx="100" cy="'+[78,74,70][k]+'" r="'+r[0]+'"/>');L('<circle cx="'+[62,58,54][k]+'" cy="100" r="'+r[1]+'"/>');
    L('<circle cx="'+[142,144,148][k]+'" cy="'+[110,104,102][k]+'" r="'+r[1]+'"/>');L('<circle cx="122" cy="'+[58,56,52][k]+'" r="20"/>');
  }
  const tot=ok+over,nAut=over?Math.min(leaves.length,Math.max(1,Math.round(leaves.length*over/tot*1.6))):0;
  const greens=["--leaf1","--leaf2","--leaf3"],reds=["--autumn1","--autumn2"];
  const lv=leaves.map((s,i)=>s.replace(/^<(\w+)/,'<$1 style="fill:var('+(i>=leaves.length-nAut?reds[i%2]:greens[i%3])+')"')).join("");
  let deco="";
  if(stage===6)deco=[[80,56],[124,62],[56,92],[150,96],[104,96]].map(([x,y],i)=>'<circle cx="'+x+'" cy="'+y+'" r="'+(i%2?6:7)+'" style="fill:'+(i%2?"#fff":"var(--bloom)")+'"/>').join("");
  if(stage===7)deco=[[78,58],[126,54],[104,92],[52,98],[152,104]].map(([x,y])=>'<circle cx="'+x+'" cy="'+y+'" r="8" style="fill:var(--fruit)"/>').join("")+'<circle cx="140" cy="76" r="7" style="fill:var(--gold)"/>';
  const fallen=over&&stage>=4?'<ellipse cx="150" cy="214" rx="6" ry="3" style="fill:var(--autumn2)" transform="rotate(20 150 214)"/>'+(over>2?'<ellipse cx="44" cy="236" rx="6" ry="3" style="fill:var(--autumn1)" transform="rotate(-15 44 236)"/>':''):'';
  return '<svg viewBox="0 0 200 260" aria-hidden="true"><ellipse cx="100" cy="252" rx="70" ry="7" style="fill:var(--ground)"/>'+fallen+
    '<g class="sway">'+body+lv+deco+'</g><path d="M60 210H140L132 250H68Z" style="fill:var(--pot)"/><rect x="54" y="202" width="92" height="14" rx="5" style="fill:var(--pot2)"/></svg>';
}
function renderTree(){
  const cm=ymOf(today());
  if(data.budget&&!(cm in data.budgets)){data.budgets[cm]=data.budget;save()}
  const g=monthGrowth(ym),M=Number(ym.slice(5)),cur=ym===ymOf(today());
  const ok=g?g.ok:0,over=g?g.over:0,st=stageOf(ok);
  $("treeK").textContent=(cur?"今月":M+"月")+"の木";
  $("treeV").textContent=g?STAGES[st][1]:cur?"まだ植えていません":ym>ymOf(today())?"これから":"予算のない月";
  $("tree").innerHTML=treeSVG(st,over,ok);
  $("tree").setAttribute("aria-label",(g?STAGES[st][1]:"種")+"の木。予算内 "+ok+"日、超過 "+over+"日");
  const chip=$("treeChip");chip.hidden=!g;chip.textContent="予算内 "+ok+"日"+(over?"・超過 "+over+"日":"");
  let h;
  if(cur&&g){
    const t=g.today,left=t.left,pct=t.target>0?Math.min(100,t.spent/t.target*100):(t.spent?100:0);
    h='<div class="l"><span>今日の目安まで</span>'+(left>=0?'<b class="num">あと '+yen(left)+'</b>':'<b class="num neg">'+yen(-left)+' オーバー</b>')+'</div>'+
      '<div class="track"><div class="fill'+(left<0?" over":pct>80?" warn":"")+'" style="width:'+pct.toFixed(1)+'%"></div></div>';
    if(!t.has&&!t.ns)h+='<div class="note">記録のない日は数えません。使わなかった日はボタンで確定できます。</div><button class="gbtn" data-g="nospend">今日は使わなかった</button>';
    else if(left>=0){
      const s2=stageOf(ok+1),nx=STAGES[s2+1];
      h+='<div class="note">このままなら今日で予算内 '+(ok+1)+'日'+(s2>st?'。「'+STAGES[s2][1]+'」に育ちます':nx?'。「'+nx[1]+'」まであと'+(nx[0]-ok-1)+'日':'')+'</div>';
      if(!t.has)h+='<button class="gbtn" data-g="undoNospend">「使わなかった」を取り消す</button>';
    }else h+='<div class="note">今日は紅葉の日。明日からまた育ちます。</div>';
  }else if(cur)h='<div class="l"><span>予算を決めると、木が育ち始めます</span></div><button class="gbtn" data-g="budget">予算を設定</button>';
  else if(g)h='<div class="l"><span>'+M+'月の結果</span><b>'+STAGES[st][1]+'</b></div><div class="note">予算内 '+ok+'日・超過 '+over+'日</div>';
  else h='<div class="note">'+(ym>ymOf(today())?"この月はまだ始まっていません。":"この月は予算が設定されていなかったので、木はありません。")+'</div>';
  $("goal").innerHTML=h;
  if(cur&&g){ // 日付が変わって段階が上がったら知らせる
    const seen=data.treeSeen[ym];
    if(seen!=null&&st>seen){toast(M+"月の木が「"+STAGES[st][1]+"」に育ちました");popTree()}
    if(seen!==st){data.treeSeen[ym]=st;save()}
  }
}
let popT;
function popTree(){const t=$("tree");t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop");clearTimeout(popT);popT=setTimeout(()=>t.classList.remove("pop"),800)}
$("goal").addEventListener("click",e=>{
  const b=e.target.closest("[data-g]");if(!b)return;
  const a=b.dataset.g;
  if(a==="budget")openBudget();
  else if(a==="nospend"){data.noSpend[today()]=true;save();render();popTree();toast("今日は「使わなかった日」にしました")}
  else if(a==="undoNospend"){delete data.noSpend[today()];save();render()}
});
function openForest(){
  const cur=ymOf(today());let m=ymOf(data.entries.reduce((a,e)=>e.date<a?e.date:a,today()));const months=[];
  while(m<=cur){months.push(m);m=shiftYm(m,1)}
  const gs=months.reverse().map(x=>[x,monthGrowth(x)]).filter(([,g])=>g);
  const done=gs.filter(([x])=>x<cur);
  const thisY=cur.slice(0,4),label=x=>(x.slice(0,4)===thisY?"":x.slice(0,4)+"年")+Number(x.slice(5))+"月";
  openSheet(head("わたしの森")+
    '<div class="fstats"><div><b class="num">'+gs.length+'</b><span>本の木</span></div><div><b class="num">'+done.filter(([,g])=>g.ok>=25).length+'</b><span>実った月</span></div><div><b class="num">'+Math.max(0,...gs.map(([,g])=>g.ok))+'</b><span>最高の予算内日数</span></div></div>'+
    (gs.length?'<div class="forest">'+gs.map(([x,g])=>{const st=stageOf(g.ok);return'<button class="ftree'+(x===ym?" cur":"")+'" data-act="forestGo" data-m="'+x+'">'+treeSVG(st,g.over,g.ok)+'<b>'+label(x)+'</b><span>'+(x===cur?"育成中・":"")+STAGES[st][1]+'・予算内'+g.ok+'日</span></button>'}).join("")+'</div>'
      :'<div class="note">予算を設定すると、毎月1本ずつ木が増えていきます。</div>')+
    '<div class="note" style="text-align:center">木をタップすると、その月を開きます</div>');
}

function autoGrow(){q.style.height="46px";q.style.height=Math.min(140,q.scrollHeight+3)+"px"}
function updatePreview(){

async function shareFile(name,text,type){
  const file=new File([text],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

function exportCSV(){

let receiptAbort=null;
$("cam").onclick=()=>{

  try{
    const r=await readReceipt(img.b64);
    draft={type:r.type==="in"?"in":"out",amt:r.total||"",cat:r.category||"その他",date:/^\d{4}-\d{2}-\d{2}$/.test(r.date||"")?r.date:today(),memo:(r.store||"").slice(0,60),_receipt:true};
    if(!CATS[draft.type].includes(draft.cat))draft.cat="その他";

  }catch(err){
    if(err.name==="AbortError")return;
    openSheet(head("読み取れませんでした")+'<div class="err">'+esc(err.message||"通信に失敗しました")+'</div><div class="btnrow"><button class="ghost" data-act="retakePhoto">撮り直す</button><button class="ghost" data-act="manual">手で入力</button></div>');
  }
});
function shrink(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const max=1400,s=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      const url=c.toDataURL("image/jpeg",.82);URL.revokeObjectURL(u);res({url,b64:url.split(",")[1]});
    };
    im.onerror=rej;im.src=u;
  });
}
async function readReceipt(b64){
  receiptAbort=new AbortController();
  const prompt="この画像は日本のレシート（または領収書・明細）です。読み取って、次の形のJSONだけを返してください。説明文は不要です。\n"+
    '{"date":"YYYY-MM-DD または null","store":"店名（短く）","total":支払い合計の整数,"category":"カテゴリ","type":"out"}\n'+
    "categoryは次から1つ：「"+CATS.out.join("・")+"」。total は税込の支払い合計（お釣りや預かり金ではない）。今日は"+today()+"です。年が読めない場合は今日に近い日付にしてください。レシートでない画像なら {\"error\":\"理由\"} を返してください。";
  let res;
  try{
    res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:receiptAbort.signal,
      headers:{"content-type":"application/json","x-api-key":data.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:data.model||"claude-haiku-5-5",max_tokens:300,messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:prompt}]}]})});
  }catch(e){if(e.name==="AbortError")throw e;throw new Error("通信できませんでした。電波の届く場所でもう一度試してください。")}
  if(!res.ok){
    const msg=res.status===401?"APIキーが正しくありません。設定から入れ直してください。":res.status===429?"短時間に使いすぎました。少し待ってから試してください。":res.status===400?"リクエストが受け付けられませんでした。モデルの選択を変えて試してください。":"Claudeから応答がありませんでした（"+res.status+"）。";
    throw new Error(msg);
  }
  const j=await res.json();
  const text=(j.content||[]).map(c=>c.text||"").join("");
  const m=text.match(/\{[\s\S]*\}/);if(!m)throw new Error("読み取り結果を解釈できませんでした。明るい場所で撮り直してみてください。");
  const o=JSON.parse(m[0]);if(o.error)throw new Error("レシートとして読めませんでした："+o.error);
  o.total=Math.round(Number(String(o.total).replace(/[^\d.]/g,"")))||0;
  return o;
}
